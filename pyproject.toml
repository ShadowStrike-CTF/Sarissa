[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sarissa"
version = "1.9.1"
description = "Rapid-access CTF dashboard for digital forensics competitions. by ShadowStrike."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ShadowStrike", email = "r@strategos.au"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2.4",  # vendored megdan-schema (src/sarissa/_vendor) needs StringConstraints
    "python-magic; sys_platform != 'win32'",  # both ship the `magic` module — never together
    "python-magic-bin; sys_platform == 'win32'",
    "rich",
]

[project.optional-dependencies]
test = ["pytest", "httpx2"]

[project.scripts]
sarissa = "sarissa.main:main"

[project.urls]
"Source" = "https://github.com/ShadowStrike-CTF/sarissa"

[tool.hatch.build.targets.wheel]
packages = ["src/sarissa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
